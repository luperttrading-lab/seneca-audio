<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Seneca Miniaturbild</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Literata:ital,opsz,wght@1,7..72,400&family=IBM+Plex+Sans:wght@600&display=block">
<style>
  /* YouTube-Miniaturbild 1280 × 720 (Empfehlung von YouTube), gleiche Farben und Schriften wie die Startseite im Video.
     In der Liste am Handy ist das Bild nur etwa 400 px breit (Faktor 0,31): darum wenige, große Zeilen; die kleinste
     Schrift (56 px) bleibt dort gut 17 px hoch. „Kapitel N“ kommt aus ?kapitel=N, ohne Angabe steht nur „Hörbuch“. */
  :root { --stein: #161a19; --tinte: #e9edeb; --bronze: #d29f62;
    --display: "Cinzel", Georgia, serif; --text: "Literata", Georgia, serif; --ui: "IBM Plex Sans", system-ui, sans-serif; }
  html, body { margin: 0; width: 1280px; height: 720px; overflow: hidden; }
  body { background: radial-gradient(ellipse 120% 90% at 50% 45%, #1e2423 0%, var(--stein) 70%); color: var(--tinte);
    display: grid; place-content: center; justify-items: center; text-align: center; }
  .autor { font: 600 58px/1 var(--ui); letter-spacing: .3em; margin-right: -.3em; text-transform: uppercase; color: var(--bronze); }
  h1 { margin: 34px 0 0; font: 600 150px/1 var(--display); letter-spacing: .02em; white-space: nowrap; }
  i { width: 160px; height: 4px; background: var(--bronze); margin: 40px 0 30px; }
  .deutsch { margin: 0; font: italic 400 86px/1.1 var(--text); }
  .marke { margin-top: 50px; padding: 14px 34px 16px; border: 3px solid var(--bronze); border-radius: 14px;
    font: 600 56px/1 var(--ui); letter-spacing: .12em; text-transform: uppercase; color: var(--bronze); }
</style>
</head>
<body>
  <span class="autor">Seneca</span>
  <h1>De vita beata</h1>
  <i></i>
  <p class="deutsch">Vom glücklichen Leben</p>
  <span class="marke" id="marke">Hörbuch</span>
<script>
  var k = new URLSearchParams(location.search).get("kapitel");
  if (k) document.getElementById("marke").textContent = "Hörbuch · Kapitel " + k;
  function bereit() {
    return Promise.all(["600 150px Cinzel", "italic 400 86px Literata", "600 58px 'IBM Plex Sans'"]
      .map(function (f) { return document.fonts.load(f, "Glück"); })).then(function () { return document.fonts.ready; });
  }
</script>
</body>
</html>
