<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Seneca Videobild</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Literata:opsz,wght@7..72,400&family=IBM+Plex+Sans:wght@500;600&display=block">
<style>
  /* Ein Videobild 1920 × 1080 wie der Lesemodus der Hörbuch-Seite: der ganze Teil als fließender Text, die gesprochene
     Zeile steht im Band in der Mitte, das Wort färbt sich von links nach rechts; Stellenmarken „1 (2)“ im Text und in der Ecke.
     zeige(t) berechnet jedes Bild allein aus der Zeit t, damit Bild für Bild gerendert werden kann. */
  :root {
    --stein: #161a19; --tinte: #e9edeb; --grau: #8f9a95; --bronze: #d29f62; --bronze-hell: #3a2c1c;
    --display: "Cinzel", Georgia, serif; --text: "Literata", Georgia, serif; --ui: "IBM Plex Sans", system-ui, sans-serif;
    --lh: 86px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--stein); color: var(--tinte); }
  body { font: 500 24px/1.4 var(--ui); background: radial-gradient(ellipse 120% 90% at 50% 45%, #1b201f 0%, var(--stein) 70%); }
  .kopf { position: absolute; top: 60px; left: 120px; right: 120px; display: flex; justify-content: space-between; align-items: flex-start; z-index: 2; }
  .werk { font: 600 22px/1.3 var(--ui); letter-spacing: .16em; text-transform: uppercase; color: var(--bronze); }
  .stelle { text-align: right; }
  .stelle b { display: block; font: 600 38px/1.1 var(--ui); font-variant-numeric: tabular-nums; color: var(--tinte); }
  .stelle span { display: block; margin-top: 6px; font-size: 22px; color: var(--grau); }
  .fenster { position: absolute; left: 240px; right: 240px; top: 170px; bottom: 50px; overflow: hidden;
    -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,.12) 0%, #000 30%, #000 70%, rgba(0,0,0,.12) 100%);
    mask-image: linear-gradient(to bottom, rgba(0,0,0,.12) 0%, #000 30%, #000 70%, rgba(0,0,0,.12) 100%); }
  .band { position: absolute; left: -24px; right: -24px; top: 50%; height: 140px; margin-top: -70px; border-radius: 18px;
    background: linear-gradient(to bottom, transparent 0%, var(--bronze-hell) 26%, var(--bronze-hell) 74%, transparent 100%); }
  .inhalt { position: relative; font: 400 54px/var(--lh) var(--text); will-change: transform; }
  .inhalt p { margin: 0; }
  .inhalt p + p { text-indent: 1.4em; }
  .w { color: transparent; -webkit-background-clip: text; background-clip: text;
    background-image: linear-gradient(90deg, var(--tinte) calc(var(--f, 0) * (100% + 1em) - 1em), var(--grau) calc(var(--f, 0) * (100% + 1em))); }
  .w.vorbei { --f: 1; }
  .marke { font: 600 .5em/1 var(--ui); letter-spacing: .04em; color: var(--bronze); margin-right: .45em; white-space: nowrap; vertical-align: .18em; }
  .titelkarte { position: absolute; inset: 0; display: grid; place-content: center; justify-items: center; gap: 28px; text-align: center; }
  .titelkarte .ab { font: 600 26px/1 var(--ui); letter-spacing: .18em; text-transform: uppercase; color: var(--bronze); }
  .titelkarte h1 { margin: 0; font: 600 96px/1.15 var(--display); letter-spacing: .03em; max-width: 1500px; text-wrap: balance; }
  .titelkarte i { width: 120px; height: 2px; background: var(--bronze); }
  .titelkarte p { margin: 0; font: 500 28px/1.3 var(--ui); color: var(--grau); }
  #textbild { position: absolute; inset: 0; }
</style>
</head>
<body>
  <section class="titelkarte" id="titelkarte">
    <span class="ab" id="t-ab"></span>
    <h1 id="t-titel"></h1>
    <i></i>
    <p>Seneca · Vom glücklichen Leben</p>
  </section>
  <div id="textbild">
    <header class="kopf">
      <span class="werk">Seneca · Vom glücklichen Leben</span>
      <div class="stelle"><b id="stelle"></b><span id="teil"></span></div>
    </header>
    <div class="fenster" id="fenster"><div class="band"></div><div class="inhalt" id="inhalt"></div></div>
  </div>
<script>
  // D: {w, t, p, stelle ("1,2" je Wort), titel, abschnitt, teil, titel_ende, ende}
  var D, spans = [], kurve, LH, jetzt = -2, stelleJetzt = "";
  var marke = function (s) { var k = s.split(","); return k[0] + " (" + k[1] + ")"; };
  function pchip(x, v) {   // monotone kubische Interpolation wie auf der Hörbuch-Seite
    var m = [], h = [], d = [], len = x.length, i;
    if (len < 2) return function () { return v[0] || 0; };
    for (i = 0; i < len - 1; i++) { h[i] = x[i + 1] - x[i]; d[i] = (v[i + 1] - v[i]) / h[i]; }
    m[0] = d[0]; m[len - 1] = d[len - 2];
    for (i = 1; i < len - 1; i++) {
      if (d[i - 1] * d[i] <= 0) m[i] = 0;
      else { var w1 = 2 * h[i] + h[i - 1], w2 = h[i] + 2 * h[i - 1]; m[i] = (w1 + w2) / (w1 / d[i - 1] + w2 / d[i]); }
    }
    return function (t) {
      if (t <= x[0]) return v[0]; if (t >= x[len - 1]) return v[len - 1];
      var lo = 0, hi = len - 1;
      while (hi - lo > 1) { var mi = (lo + hi) >> 1; if (x[mi] <= t) lo = mi; else hi = mi; }
      var hh = x[hi] - x[lo], s = (t - x[lo]) / hh, s2 = s * s, s3 = s2 * s;
      return (2 * s3 - 3 * s2 + 1) * v[lo] + (s3 - 2 * s2 + s) * hh * m[lo] + (3 * s2 - 2 * s3) * v[hi] + (s3 - s2) * hh * m[hi];
    };
  }
  // Erst alle Schriften laden: lade() berechnet die Zeilen, mit einer Ersatzschrift bräche der Text anders um
  function bereit() {
    return Promise.all(["400 54px Literata", "600 27px 'IBM Plex Sans'", "500 22px 'IBM Plex Sans'", "600 96px Cinzel"]
      .map(function (f) { return document.fonts.load(f, "Glück"); })).then(function () { return document.fonts.ready; });
  }
  function lade(daten) {
    D = daten; document.getElementById("t-ab").textContent = D.abschnitt; document.getElementById("t-titel").textContent = D.titel;
    document.getElementById("teil").textContent = D.teil;
    var inhalt = document.getElementById("inhalt"), p = null, abs = -1;
    D.w.forEach(function (w, i) {
      if (D.p[i] !== abs) { abs = D.p[i]; p = document.createElement("p"); inhalt.appendChild(p); }
      else p.appendChild(document.createTextNode(" "));
      if (i === 0 || D.stelle[i] !== D.stelle[i - 1]) {
        var m = document.createElement("span"); m.className = "marke"; m.textContent = marke(D.stelle[i]); p.appendChild(m);
      }
      var s = document.createElement("span"); s.className = "w"; s.textContent = w; p.appendChild(s); spans.push(s);
    });
    // Zeile k steht im Band, wenn der Text um k·Zeilenhöhe verschoben ist. Stützstellen an den Zeilenanfängen: dort steht das
    // Band zwischen alter und neuer Zeile, (k − ½)·Zeilenhöhe; die monotone Interpolation hält die gesprochene Zeile so immer
    // höchstens eine halbe Zeile neben der Bandmitte (die Mitte der Sprechzeit als Stützstelle wich bis 0,65 Zeilen ab).
    var fenster = document.getElementById("fenster"); LH = parseFloat(getComputedStyle(inhalt).lineHeight);
    var rand = (fenster.clientHeight - LH) / 2; inhalt.style.paddingTop = rand + "px"; inhalt.style.paddingBottom = rand + "px";
    var basis = spans[0].offsetTop, zeileVon = spans.map(function (s) { return Math.round((s.offsetTop - basis) / LH); });
    var zeilen = zeileVon[zeileVon.length - 1] + 1, anfang = [], xs = [], vs = [], k, n = D.t.length;
    for (k = 0; k < zeilen; k++) anfang.push(Infinity);
    D.t.forEach(function (t, i) { if (t < anfang[zeileVon[i]]) anfang[zeileVon[i]] = t; });
    for (k = 0; k < zeilen; k++) anfang[k] = Math.max(isFinite(anfang[k]) ? anfang[k] : 0, k ? anfang[k - 1] : 0);
    xs.push(anfang[0]); vs.push(0);
    for (k = 1; k < zeilen; k++) { if (anfang[k] > xs[xs.length - 1]) { xs.push(anfang[k]); vs.push((k - 0.5) * LH); } }
    var schluss = Math.min(D.ende, D.t[n - 1] + 0.08 + 0.07 * D.w[n - 1].length);
    if (schluss > xs[xs.length - 1]) { xs.push(schluss); vs.push((zeilen - 1) * LH); }
    kurve = pchip(xs, vs);
    return { zeilen: zeilen, zeilenhoehe: LH };
  }
  function wortBei(t) {
    var lo = 0, hi = D.t.length - 1, r = -1;
    while (lo <= hi) { var mi = (lo + hi) >> 1; if (D.t[mi] <= t) { r = mi; lo = mi + 1; } else hi = mi - 1; }
    return r;
  }
  function zeige(t) {
    var weich = function (x) { x = Math.max(0, Math.min(1, x)); return x * x * (3 - 2 * x); };   // erst Titel aus, dann Text ein
    document.getElementById("titelkarte").style.opacity = String(1 - weich((t - D.titel_ende) / 0.4));
    document.getElementById("textbild").style.opacity = String(weich((t - D.titel_ende - 0.35) / 0.5));
    document.getElementById("inhalt").style.transform = "translate3d(0," + (-kurve(t)).toFixed(2) + "px,0)";
    var i = wortBei(t + 0.03);
    if (i !== jetzt) { spans.forEach(function (s, k) { s.classList.toggle("vorbei", k < i); if (k !== i) s.style.removeProperty("--f"); }); jetzt = i; }
    if (i >= 0) {
      var t0 = D.t[i], t1 = i + 1 < D.t.length ? D.t[i + 1] : D.ende, e = Math.min(t1, t0 + 0.08 + 0.07 * D.w[i].length);
      spans[i].style.setProperty("--f", Math.max(0, Math.min(1, (t - t0) / Math.max(0.05, e - t0))).toFixed(3));
    }
    var st = D.stelle[Math.max(0, i)];
    if (st !== stelleJetzt) { stelleJetzt = st; document.getElementById("stelle").textContent = "Kapitel " + marke(st); }
  }
</script>
</body>
</html>
