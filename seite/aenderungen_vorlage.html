<title>{{titel}}</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Änderungsvorschläge, {{kapitel}}: ganzer Satz vorher und nachher, Entferntes rot, Neues gold.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Literata:opsz,wght@7..72,400&family=IBM+Plex+Sans:wght@500;600&display=swap">
<style>
  /* Eine Spalte wie die Hörprobe, dunkel wie das Video. Gold heißt „neu“, Rot durchgestrichen „fällt weg“;
     die Sätze in der Leseschrift des Videos, Beschriftungen in der Bedienschrift. Bewusst nur ein dunkles Aussehen. */
  :root {
    --stein: #161a19; --tafel: #1e2422; --tinte: #e9edeb; --grau: #9aa59f; --linie: #333b38;
    --bronze: #d29f62; --neu-grund: rgba(210, 159, 98, .40); --weg: #ee8b7b;
    --display: "Cinzel", Georgia, serif; --text: "Literata", Georgia, serif; --ui: "IBM Plex Sans", system-ui, -apple-system, sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--stein); color: var(--tinte); font: 16px/1.5 var(--ui); }
  main { max-width: 680px; margin: 0 auto; display: grid; gap: 18px;
    padding-block: 28px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .kopf { display: grid; gap: 6px; text-align: center; }
  .eyebrow { font: 600 12px/1.3 var(--ui); letter-spacing: .14em; text-transform: uppercase; color: var(--bronze); }
  h1 { margin: 0; font: 600 clamp(26px, 7.5vw, 34px)/1.15 var(--display); letter-spacing: .03em; text-wrap: balance; }
  .lead { margin: 0; color: var(--grau); font-size: 15px; }
  .legende { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px 18px; margin: 4px 0 0; font-size: 14px; color: var(--grau); }
  .stelle { display: grid; gap: 12px; padding: 16px; border: 1px solid var(--linie); border-radius: 14px; background: var(--tafel); min-width: 0; }
  .stelle h2 { margin: 0; display: flex; gap: 10px; align-items: center; font: 600 13px/1.3 var(--ui); letter-spacing: .12em; text-transform: uppercase; color: var(--bronze); }
  .nr { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; border: 1px solid var(--bronze); font-variant-numeric: tabular-nums; letter-spacing: 0; }
  .paar { display: grid; gap: 10px; }
  .satz, .davor { margin: 0; font: 400 19px/1.6 var(--text); }
  .lbl, .davor span { display: block; margin-bottom: 2px; font: 600 11px/1.3 var(--ui); letter-spacing: .14em; text-transform: uppercase; color: var(--grau); }
  .davor { font-size: 16px; color: var(--grau); padding-bottom: 10px; border-bottom: 1px solid var(--linie); }
  .alt { color: var(--grau); }
  del { color: var(--weg); text-decoration: line-through; text-decoration-thickness: 2px; }
  ins { text-decoration: none; color: var(--tinte); background: var(--neu-grund); border-radius: 4px; padding: 1px 3px; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
  .neu { color: var(--tinte); }
  .grund { margin: 0; font-size: 14px; color: var(--grau); }
  .grund:empty { display: none; }
  .gruppe { margin: 14px 0 0; font: 600 22px/1.2 var(--display); letter-spacing: .03em; text-align: center; }
  .fuss { margin: 0; text-align: center; font-size: 14px; color: var(--grau); }
</style>

<main>
  <header class="kopf">
    <span class="eyebrow">Seneca · De vita beata · {{kapitel}}</span>
    <h1>Änderungen</h1>
    <p class="lead">{{lead}}</p>
    <p class="legende"><span><del>so</del> fällt weg</span><span><ins>so</ins> ist neu</span></p>
  </header>

{{karten}}

  <p class="fuss">{{anzahl}} Stellen. Sag mir im Chat, welche ich übernehmen soll, etwa „alle“ oder „alle außer 6“.</p>
</main>
